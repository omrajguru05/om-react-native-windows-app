<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Om - Desktop</title>
  <style>
    @font-face {
      font-family: 'Relative Sans';
      src: url('./fonts/The-Relative-Sans-Variable.ttf') format('truetype-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Relative Rounded';
      src: url('./fonts/The-Relative-Rounded-Variable.ttf') format('truetype-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Relative Mono';
      src: url('./fonts/The-Relative-Mono-Variable.ttf') format('truetype-variations');
      font-weight: 100 900;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f5f5f5;
      font-family: 'Relative Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Minimal native scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383838;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
